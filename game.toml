# IWRAM-installed code (runtime addresses, not ROM bytes).
# These cannot be static-recompiled from the cartridge image; they stay
# on the self-heal / interpreter path unless a [[code_copy]] is identified.
# Documented so the miss report is honest.


# HoD uses a Flash save chip (not SRAM like Circle of the Moon).

[bios]
path = "gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[save]
type = "flash512"

# IWRAM code installs (from loader table 0x0800EBF4)
# size field is 0x0400xxxx: high half flags, low half byte length.
[[code_copy]]
runtime_start = 0x030043A0
source_start  = 0x08016CF0
size          = 0x00000400
name          = "iwram_43A0"
note          = "loader table 0x0800EBF4; ARM blob"

[[code_copy]]
runtime_start = 0x030047A0
source_start  = 0x08016FF4
size          = 0x00000500
name          = "iwram_47A0"
note          = "loader table 0x0800EC00; ARM blob"

